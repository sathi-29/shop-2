[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent"
version = "0.1.0"
description = "Policy-gated voice assistant with a sandboxed tool layer and an audit log"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
voice-agent = "voice_agent.cli:main"

[tool.setuptools]
packages = ["voice_agent"]