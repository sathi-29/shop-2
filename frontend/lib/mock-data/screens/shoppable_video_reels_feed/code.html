<script>
  (function () {
    const tabFollowing = document.getElementById('tab-following');
    const tabForYou = document.getElementById('tab-foryou');

    function setActiveTab(active, inactive) {
      active.classList.remove('text-on-primary/70');
      active.classList.add('text-on-primary', 'font-bold');
      active.lastElementChild.classList.remove('bg-transparent', 'w-6');
      active.lastElementChild.classList.add('bg-on-primary', 'w-8');

      inactive.classList.remove('text-on-primary', 'font-bold');
      inactive.classList.add('text-on-primary/70');
      inactive.lastElementChild.classList.remove('bg-on-primary', 'w-8');
      inactive.lastElementChild.classList.add('bg-transparent', 'w-6');
    }

    if (tabFollowing && tabForYou) {
      tabFollowing.addEventListener('click', function () {
        setActiveTab(tabFollowing, tabForYou);
      });
      tabForYou.addEventListener('click', function () {
        setActiveTab(tabForYou, tabFollowing);
      });
    }

    const btnLike = document.getElementById('btn-like');
    const iconLike = document.getElementById('icon-like');
    const countLike = document.getElementById('count-like');
    let liked = false;

    if (btnLike && iconLike && countLike) {
      btnLike.addEventListener('click', function () {
        liked = !liked;
        iconLike.style.fontVariationSettings = liked ? "'FILL' 1" : "'FILL' 0";
        iconLike.classList.toggle('text-secondary-container', liked);
        countLike.textContent = liked ? '24.9k' : '24.8k';
      });
    }

    const btnSave = document.getElementById('btn-save');
    const iconSave = document.getElementById('icon-save');
    const countSave = document.getElementById('count-save');
    let saved = false;

    if (btnSave && iconSave && countSave) {
      btnSave.addEventListener('click', function () {
        saved = !saved;
        iconSave.style.fontVariationSettings = saved ? "'FILL' 1" : "'FILL' 0";
        iconSave.classList.toggle('text-primary-fixed', saved);
        countSave.textContent = saved ? '3.5k' : '3.4k';
      });
    }

    const btnFollow = document.getElementById('btn-follow');
    let following = false;

    if (btnFollow) {
      btnFollow.addEventListener('click', function () {
        following = !following;
        btnFollow.textContent = following ? 'Following' : 'Follow';
        btnFollow.classList.toggle('bg-primary', following);
        btnFollow.classList.toggle('bg-on-primary/20', !following);
      });
    }

    const btnBuy = document.getElementById('btn-buy');
    if (btnBuy) {
      btnBuy.addEventListener('click', function () {
        const originalText = btnBuy.textContent;
        btnBuy.textContent = 'Added!';
        btnBuy.classList.remove('bg-secondary-container');
        btnBuy.classList.add('bg-primary');
        setTimeout(function () {
          btnBuy.textContent = originalText;
          btnBuy.classList.remove('bg-primary');
          btnBuy.classList.add('bg-secondary-container');
        }, 1200);
      });
    }
  })();
